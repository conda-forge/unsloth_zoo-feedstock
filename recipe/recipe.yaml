schema_version: 1

context:
  name: unsloth_zoo
  version: "2026.10.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/${{ name[0] }}/${{ name }}/unsloth_zoo-${{ version }}.tar.gz
  sha256: 1f12582295cbcb1e7a505fb79cb5791e758889d038851f13385c03eafc0a52de

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools ==84.0.0
    - setuptools-scm ==9.2.0
    - pip
  run:
    - python >=${{ python_min }},<3.15
    - pytorch >=2.4.0,<2.13
    - torchao >=0.13,!=0.14
    - triton >=3.0.0
    - packaging >=24.1
    - tyro
    - transformers >=4.52.4,!=4.53.0,!=4.54.0,!=4.55.0,!=4.55.1,<=4.56.2
    - datasets >=3.4.1,!=4.0.*,!=4.1.0,<4.4.0
    - sentencepiece >=0.2.0
    - tqdm
    - psutil
    - wheel >=0.42.0
    - numpy
    - accelerate >=0.34.1
    - trl >=0.18.2,!=0.19.0,<=0.23.0
    - peft >=0.18.0,!=0.11.0
    - protobuf
    - huggingface_hub >=0.34.0
    - hf-transfer
    - cut_cross_entropy
    - pillow
    - regex
    - msgspec
    - typing_extensions
    - filelock
    - requests
    - einops
    - mistral-common

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
        - numpy <2.4
    script:
      - pip check

about:
  summary: Utils for Unsloth
  license: LGPL-3.0-or-later AND MIT AND Apache-2.0
  license_file:
    - LICENSE
    - COPYING
    - unsloth_zoo/_vendored/NOTICE
    - unsloth_zoo/_vendored/fla/LICENSE
    - unsloth_zoo/_vendored/vllm/LICENSE
  homepage: https://github.com/unslothai/unsloth_zoo

extra:
  recipe-maintainers:
    - isuruf
    - timkpaine
